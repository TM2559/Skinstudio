# DIAGNOSTIKA – dočasný workflow, po vyhodnocení smazat.
# Vypisuje POUZE délky secrets, nikdy jejich hodnoty. Délky GitHub nemaskuje,
# takže z výstupu se dá poznat, které secrets jsou prázdné, aniž by cokoli uniklo.
# Nic nebuilduje, nic nenasazuje.
name: DIAG – delky secrets
on: pull_request

jobs:
  check_secrets:
    runs-on: ubuntu-latest
    env:
      VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
      VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
      VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
      VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
      VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
      VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
      VITE_EMAILJS_SERVICE_ID: ${{ secrets.VITE_EMAILJS_SERVICE_ID }}
      FIREBASE_SERVICE_ACCOUNT_TM_RESERVATIONS: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_TM_RESERVATIONS }}
    steps:
      - name: Delky secrets (hodnoty se nevypisuji)
        run: |
          for name in VITE_FIREBASE_API_KEY VITE_FIREBASE_AUTH_DOMAIN \
                      VITE_FIREBASE_PROJECT_ID VITE_FIREBASE_STORAGE_BUCKET \
                      VITE_FIREBASE_MESSAGING_SENDER_ID VITE_FIREBASE_APP_ID \
                      VITE_EMAILJS_SERVICE_ID FIREBASE_SERVICE_ACCOUNT_TM_RESERVATIONS; do
            value="${!name}"
            printf '%-45s delka=%s\n' "$name" "${#value}"
          done
