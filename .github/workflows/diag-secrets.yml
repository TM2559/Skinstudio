# DIAGNOSTIKA – dočasný workflow, po vyhodnocení smazat.
# Vypisuje POUZE délky secrets, nikdy jejich hodnoty. Délky GitHub nemaskuje,
# takže z výstupu se dá poznat, které secrets jsou prázdné, aniž by cokoli uniklo.
# Nic nebuilduje, nic nenasazuje.
name: DIAG – delky secrets
on: pull_request

jobs:
  check_secrets:
    runs-on: ubuntu-latest
    env:
      VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
      VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
      VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
      VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
      VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
      VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
      VITE_EMAILJS_SERVICE_ID: ${{ secrets.VITE_EMAILJS_SERVICE_ID }}
      FIREBASE_SERVICE_ACCOUNT_TM_RESERVATIONS: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_TM_RESERVATIONS }}
    steps:
      - name: Delky secrets (hodnoty se nevypisuji)
        run: |
          for name in VITE_FIREBASE_API_KEY VITE_FIREBASE_AUTH_DOMAIN \
                      VITE_FIREBASE_PROJECT_ID VITE_FIREBASE_STORAGE_BUCKET \
                      VITE_FIREBASE_MESSAGING_SENDER_ID VITE_FIREBASE_APP_ID \
                      VITE_EMAILJS_SERVICE_ID FIREBASE_SERVICE_ACCOUNT_TM_RESERVATIONS; do
            value="${!name}"
            printf '%-45s delka=%s\n' "$name" "${#value}"
          done

      - uses: actions/checkout@v4

      - name: Build s testovaci hodnotou (zadny secret)
        working-directory: salon-system
        env:
          VITE_FIREBASE_API_KEY: AIzaSyDIAGMARKER0000000000000000000000000
          VITE_FIREBASE_PROJECT_ID: tm-reservations
        run: |
          echo "--- viditelnost v shellu ---"
          echo "delka v shellu = ${#VITE_FIREBASE_API_KEY}"
          echo "--- viditelnost v node ---"
          node -e 'console.log("delka v node =", (process.env.VITE_FIREBASE_API_KEY||"").length)'
          echo "--- viditelnost uvnitr npm scriptu ---"
          npm pkg set scripts.diagenv="node -e \"console.log('delka v npm scriptu =', (process.env.VITE_FIREBASE_API_KEY||'').length)\""
          npm run diagenv
          echo "--- build ---"
          npm ci
          npm run build
          echo "--- je marker v bundlu? ---"
          if grep -rq DIAGMARKER dist/assets/ 2>/dev/null; then
            echo "VYSLEDEK: MARKER NALEZEN – env do buildu dorazil"
          else
            echo "VYSLEDEK: MARKER CHYBI – env se do buildu nedostal"
          fi
          echo "--- co ma bundle v import.meta.env ---"
          grep -ohE 'MODE:"[a-z]+"[^}]{0,120}' dist/assets/index-*.js | head -1
