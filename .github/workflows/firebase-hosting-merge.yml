# Deploy na Firebase Hosting při push do main (produkce)
name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - main  # main = produkce
  workflow_dispatch:  # Ruční spuštění v záložce Actions
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    env:
      VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
      VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
      VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
      VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
      VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
      VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
      VITE_FIREBASE_MEASUREMENT_ID: ${{ secrets.VITE_FIREBASE_MEASUREMENT_ID }}
      VITE_EMAILJS_SERVICE_ID: ${{ secrets.VITE_EMAILJS_SERVICE_ID }}
      VITE_EMAILJS_CONFIRM_TEMPLATE_ID: ${{ secrets.VITE_EMAILJS_CONFIRM_TEMPLATE_ID }}
      VITE_EMAILJS_REMINDER_TEMPLATE_ID: ${{ secrets.VITE_EMAILJS_REMINDER_TEMPLATE_ID }}
      VITE_EMAILJS_PUBLIC_KEY: ${{ secrets.VITE_EMAILJS_PUBLIC_KEY }}
      VITE_INSTAGRAM_URL: ${{ secrets.VITE_INSTAGRAM_URL }}
      VITE_ADMIN_PASSWORD: ${{ secrets.VITE_ADMIN_PASSWORD }}
      # Functions se nasazují jen s nastaveným Resend – jinak by deploy přepsal e-mailovou konfiguraci prázdnou
      HAS_RESEND: ${{ secrets.RESEND_API_KEY != '' && secrets.RESEND_FROM != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Install and Build
        working-directory: salon-system
        run: npm ci && npm run build

      - name: Install Functions dependencies
        working-directory: salon-system/functions
        run: npm ci

      - name: Create Functions .env
        working-directory: salon-system/functions
        run: |
          cat > .env <<EOL
          ADMIN_PASSWORD=${{ secrets.VITE_ADMIN_PASSWORD }}
          BULKGATE_APPLICATION_ID=${{ secrets.BULKGATE_APPLICATION_ID }}
          BULKGATE_APPLICATION_TOKEN=${{ secrets.BULKGATE_APPLICATION_TOKEN }}
          BULKGATE_SENDER_ID=${{ secrets.BULKGATE_SENDER_ID }}
          BULKGATE_SENDER_ID_VALUE=${{ secrets.BULKGATE_SENDER_ID_VALUE }}
          ADMIN_SMS_PHONE=${{ secrets.ADMIN_SMS_PHONE }}
          GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
          RESEND_API_KEY=${{ secrets.RESEND_API_KEY }}
          RESEND_FROM=${{ secrets.RESEND_FROM }}
          RESEND_REPLY_TO=${{ secrets.RESEND_REPLY_TO }}
          RESEND_ADMIN_TO=${{ secrets.RESEND_ADMIN_TO }}
          EOL

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_TM_RESERVATIONS }}

      - name: Deploy Hosting
        working-directory: salon-system
        run: npx firebase-tools deploy --only hosting --project tm-reservations --non-interactive

      - name: Deploy Functions
        if: env.HAS_RESEND == 'true'
        working-directory: salon-system
        run: |
          # Jen funkce z kódu – funkce, které existují pouze v projektu (např. calendarFeed), deploy nemaže
          TARGETS=$(node --input-type=module -e "const m = await import('./functions/index.js'); console.log(Object.keys(m).map((k) => 'functions:' + k).join(','))")
          npx firebase-tools deploy --only "$TARGETS" --project tm-reservations --non-interactive

      - name: Skip Functions (chybí Resend secrets)
        if: env.HAS_RESEND != 'true'
        run: echo "::warning::Functions nenasazeny – v GitHub Secrets chybí RESEND_API_KEY nebo RESEND_FROM. Web (Hosting) nasazen normálně."
